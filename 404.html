<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>페이지를 찾을 수 없습니다 | 냉동자판기 운영 가이드</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a192a;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif}.box{width:min(600px,100%);padding:48px;border:1px solid #28465f;border-radius:22px;background:#102a40}.code{color:#43d5e7;font:800 .8rem ui-monospace,monospace;letter-spacing:.18em}h1{margin:14px 0;font-size:clamp(2rem,7vw,3.5rem);line-height:1.2;letter-spacing:-.04em}p{color:#a9bdcc;line-height:1.75}a{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:8px;background:#c9ff4a;color:#0a192a;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <span class="code">ERROR / 404</span>
    <h1>요청한 페이지를<br>찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나 존재하지 않는 경로입니다. 메인 가이드에서 냉동자판기 도입 기준을 다시 확인할 수 있습니다.</p>
    <a href="/">메인 가이드로 돌아가기</a>
  </main>
</body>
</html>
